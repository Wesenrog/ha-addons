name: Homely
version: "0.4.2"
slug: homely
description: Homely alarm system and sensors in Home Assistant through MQTT
url: https://github.com/wesenrog/ha-addons
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
services:
  - mqtt:want
options:
  username: ""
  password: ""
  home: ""
  poll_interval: 3600
  stale_after: 120
  discovery_prefix: homeassistant
  base_topic: homely
  log_level: info
  language: nb
schema:
  username: str
  password: password
  home: str?
  poll_interval: int(300,86400)
  stale_after: int(30,3600)
  discovery_prefix: str
  base_topic: str
  log_level: list(debug|info|warning|error)
  language: list(nb|en)
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
